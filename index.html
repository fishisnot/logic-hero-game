const KEY='logicHeroFinalV1';let data={done:{},coins:0,owned:[0],hero:0,sound:true};
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){data={...data,...raw};if(!data.done||typeof data.done!=='object')data.done={};if(!Array.isArray(data.owned))data.owned=[0]}}catch(e){}
let page='home',current=0,attempt=0,hints=0,selected=[],position=null,steps=[],finished=false,audio=null;
const $=id=>document.getElementById(id);const screen=$('screen');
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function completed(){return Object.keys(data.done).filter(k=>data.done[k]).length}
function unlocked(i){return i===0||!!data.done[i-1]}
function stars(){return Object.values(data.done).reduce((s,v)=>s+(v.stars||0),0)}
function beep(success=true){if(!data.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(success?660:220,audio.currentTime);if(success)o.frequency.linearRampToValueAtTime(880,audio.currentTime+.15);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.26)}catch(e){}}
function node(tag,text,cls,fn){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;if(fn)e.addEventListener('click',fn);return e}
function button(label,fn,cls='btn'){return node('button',label,cls,fn)}
function panel(){const e=node('section',undefined,'panel');screen.append(e);return e}
function show(p){if(p!=='play')runToken++;page=p;screen.replaceChildren();const nav=$('nav');nav.replaceChildren();[['home','🗺️ 地图'],['levels','🎯 关卡'],['shop','🎁 奖励'],['parent','📊 家长']].forEach(([k,t])=>nav.append(button(t,()=>show(k),' '+(page===k?'active':''))));if(p==='home')home();if(p==='levels')levelSelect();if(p==='shop')shop();if(p==='parent')parent();if(p==='play')play()}
function home(){const p=panel();const h=node('div',heroes[data.hero][0],'hero center');p.append(h,node('h2','欢迎来到智慧岛！','title center'),node('p','和 '+heroes[data.hero][1]+' 一起动脑筋，探索六座奇妙岛屿。','center'));const s=node('div',undefined,'stats');[['🏅 已通关',completed()+'/60'],['⭐ 星星',stars()],['🪙 金币',data.coins]].forEach(([k,v])=>{let e=node('div',undefined,'stat');e.append(node('b',v),node('span',k,'muted'));s.append(e)});p.append(s);let prog=node('div',undefined,'progress');let bar=node('div');bar.style.width=completed()/60*100+'%';prog.append(bar);p.append(prog);const next=levels.findIndex((_,i)=>!data.done[i]);p.append(node('div','', 'center'));const acts=node('div',undefined,'actions');acts.append(button(next<0?'🎉 全部通关 · 再玩关卡':'▶️ 继续冒险 · 第'+(next+1)+'关',()=>start(next<0?0:next),'btn green'));p.append(acts);const map=panel();map.append(node('h2','🗺️ 六大冒险世界'));let wrap=node('div',undefined,'worlds');worlds.forEach(([em,name],w)=>{let n=w*10;let count=Array.from({length:10},(_,j)=>!!data.done[n+j]).filter(Boolean).length;let card=button(em+' '+name+'\n'+count+'/10关'+(unlocked(n)?'':' 🔒'),()=>{if(unlocked(n)){current=n;show('levels')}else toast('先完成前一座岛屿的挑战！')},'world '+(count===10?'done':unlocked(n)?'':'locked'));card.style.whiteSpace='pre-line';wrap.append(card)});map.append(wrap)}
function levelSelect(){let p=panel();p.append(node('h2','🎯 选择关卡'));p.append(node('p','绿色表示已完成，黄色表示下一关。可以随时重玩已完成的关卡。','muted'));worlds.forEach(([em,name],w)=>{p.append(node('h3',em+' '+name));let grid=node('div',undefined,'levelgrid');for(let j=0;j<10;j++){let i=w*10+j;let b=button(String(i+1)+(data.done[i]?' ⭐':''),()=>start(i),'levelbtn '+(data.done[i]?'done':unlocked(i)?'current':''));b.disabled=!unlocked(i);grid.append(b)}p.append(grid)})}
function start(i){runToken++;if(!unlocked(i)){toast('先通过前一关！');return}current=i;attempt=0;hints=0;selected=[];steps=[];finished=false;position=[...levels[i].path?.[0]||[0,0]];show('play')}
function feedback(text,ok){const f=$('feedback');if(f){f.textContent=text;f.className='feedback '+(ok?'ok':'err')}}
function play(){let l=levels[current],w=Math.floor(current/10);const head=panel();head.append(node('div',worlds[w][0]+' '+worlds[w][1]+' · 第 '+(current+1)+'/60 关','tag'));head.append(node('h2',l.title,'title'));head.append(node('p',l.q,'question'));head.append(node('div','训练能力：'+l.skill,'muted'));if(l.type==='maze')maze(head,l);else if(l.type==='sequence')sequence(head,l);else{if(l.display)head.append(node('div',l.display.join('　'),'sequence center'));const choices=node('div',undefined,'choices');l.options.forEach(v=>choices.append(button(v,()=>answer(v===l.answer),'choice')));head.append(choices)}head.append(node('div','', 'feedback'));head.lastChild.id='feedback';const act=node('div',undefined,'actions');act.append(button('💡 提示 '+(hints?('('+hints+'/2)'):'') ,()=>hint(l),'btn orange'));act.append(button('🔄 重试',()=>start(current),'btn gray'));act.append(button('🗺️ 返回关卡',()=>show('levels'),'btn gray'));head.append(act)}
let commandQueue=[],running=false,runToken=0;
function maze(root,l){commandQueue=[];running=false;const grid=node('div',undefined,'maze');grid.id='maze';root.append(grid);drawMaze(l);const info=node('div','先安排方向，再点“开始执行”！','sequence center');info.id='route';root.append(info);const cmds=node('div',undefined,'commandbar');cmds.id='commands';root.append(cmds);const arrows=node('div',undefined,'arrows');[['⬆️',-1,0],['⬅️',0,-1],['⬇️',1,0],['➡️',0,1]].forEach(([txt,dr,dc])=>arrows.append(button(txt,()=>{if(running||finished||commandQueue.length>=24)return;commandQueue.push({txt,dr,dc});renderCommands();},'choice')));root.append(arrows);const act=node('div',undefined,'actions');act.append(button('▶️ 开始执行',()=>executeQueue(l),'btn green'));act.append(button('↩️ 撤销指令',()=>{if(running||finished)return;commandQueue.pop();renderCommands()},'btn gray'));act.append(button('🧹 清空指令',()=>{if(running||finished)return;commandQueue=[];renderCommands()},'btn gray'));root.append(act)}
function renderCommands(active=-1){const out=$('commands');if(!out)return;out.replaceChildren();commandQueue.forEach((x,i)=>out.append(node('span',x.txt,i===active?'active':'')));if(!commandQueue.length)out.textContent='在这里排列行动指令 ⬆️ ➡️ ⬇️ ⬅️';const route=$('route');if(route)route.textContent='已规划 '+commandQueue.length+' 步 · 最多24步'}
function drawMaze(l){const grid=$('maze');if(!grid)return;grid.replaceChildren();for(let r=0;r<4;r++)for(let c=0;c<4;c++){let hero=position[0]===r&&position[1]===c,goal=l.path[l.path.length-1][0]===r&&l.path[l.path.length-1][1]===c,wall=l.walls.some(x=>x[0]===r&&x[1]===c);grid.append(node('div',hero?heroes[data.hero][0]:wall?'🪨':goal?'🎁':'','cell '+(hero?'heroCell':wall?'wall':goal?'goal':'')))}}
async function executeQueue(l){if(running||finished)return;if(!commandQueue.length){feedback('先点击箭头，安排小勇士的行动路线！',false);return}running=true;const token=++runToken;position=[...l.path[0]];drawMaze(l);$('maze')?.classList.add('busy');for(let i=0;i<commandQueue.length;i++){if(token!==runToken)return;renderCommands(i);const {dr,dc}=commandQueue[i];await new Promise(r=>setTimeout(r,460));if(token!==runToken)return;const nr=position[0]+dr,nc=position[1]+dc;if(nr<0||nr>3||nc<0||nc>3||l.walls.some(x=>x[0]===nr&&x[1]===nc)){attempt++;beep(false);feedback('🪨 第 '+(i+1)+' 步撞到障碍啦！修改指令再试。',false);running=false;$('maze')?.classList.remove('busy');renderCommands();return}position=[nr,nc];drawMaze(l);beep(true);const goal=l.path[l.path.length-1];if(nr===goal[0]&&nc===goal[1]){running=false;answer(true);return}}running=false;$('maze')?.classList.remove('busy');renderCommands();attempt++;feedback('还没有到宝箱！继续调整路线试试看。',false)}
function sequence(root,l){const out=node('div','按顺序点击下面的卡片','sequence center');out.id='sequence';root.append(out);let choices=node('div',undefined,'choices');l.options.forEach(v=>choices.append(button(v,()=>{if(finished||selected.includes(v))return;selected.push(v);out.textContent=selected.join(' → ');if(selected.length===l.answer.length)answer(JSON.stringify(selected)===JSON.stringify(l.answer))},'choice')));root.append(choices);const acts=node('div',undefined,'actions');acts.append(button('↩️ 撤销',()=>{if(finished)return;selected.pop();out.textContent=selected.length?selected.join(' → '):'按顺序点击下面的卡片'},'btn gray'));root.append(acts)}
function answer(ok){if(finished)return;if(!ok){attempt++;beep(false);feedback('还差一点点！想一想，再试一次。',false);if(levels[current].type==='sequence'){selected=[];$('sequence').textContent='再试一次：从第一步开始'}return}finished=true;beep(true);let reward=Math.max(1,3-(hints>0?1:0)-(attempt>0?1:0));let old=data.done[current];let extra=old?Math.max(0,reward-old.stars):reward;data.done[current]={stars:Math.max(reward,old?.stars||0),skill:levels[current].skill};let coins=old?0:10;data.coins+=coins;save();feedback('🎉 成功通关！',true);const modal=$('modal');modal.replaceChildren();modal.append(node('div','🎊🏆🎊','celebrate'),node('h2','闯关成功！'),node('p','获得 '+('⭐'.repeat(reward))+' '+(coins?'和 🪙 '+coins+' 金币':'（重玩关卡）')));if(extra>0&&old)modal.append(node('p','本关星星成绩提升了！','muted'));modal.append(button(current===59?'🏆 查看冒险地图':'下一关 ➜',()=>{closeModal();if(current===59)show('home');else start(current+1)},'btn green'));modal.append(button('返回地图',()=>{closeModal();show('home')},'btn gray'));$('overlay').classList.remove('hidden');confettiBurst()}
function confettiBurst(){const layer=node('div',undefined,'confetti');document.body.append(layer);for(let i=0;i<36;i++){const piece=node('i');piece.style.left=(Math.random()*100)+'%';piece.style.background=['#ffbe39','#6d60e8','#50cba0','#ff7299','#79c8ff'][i%5];piece.style.animationDelay=(Math.random()*.6)+'s';piece.style.animationDuration=(1.6+Math.random()*1.3)+'s';layer.append(piece)}setTimeout(()=>layer.remove(),3400)}
function hint(l){if(finished)return;if(hints>=2){feedback('两条提示都看过了，再想想吧！',true);return}let t=l.hints[hints];hints++;feedback('💡 '+t,true);let btn=[...screen.querySelectorAll('button')].find(x=>x.textContent.startsWith('💡 提示'));if(btn)btn.textContent='💡 提示 ('+hints+'/2)'}
function closeModal(){$('overlay').classList.add('hidden')}
function toast(s){const m=$('modal');m.replaceChildren();m.append(node('h2','💡 小提醒'),node('p',s),button('知道啦',closeModal));$('overlay').classList.remove('hidden')}
function shop(){let p=panel();p.append(node('h2','🎁 勇士奖励屋'));p.append(node('p','🪙 现有金币：'+data.coins+'。首次通关每关获得10金币，收集金币解锁新伙伴。'));let g=node('div',undefined,'shop');heroes.forEach(([em,name],i)=>{let item=node('div',undefined,'shopitem');item.append(node('div',em,'avatar'),node('h3',name));let owned=data.owned.includes(i);item.append(button(data.hero===i?'✅ 正在使用':owned?'切换伙伴':'🪙 '+(i*80)+' 解锁',()=>{if(owned){data.hero=i;save();show('shop')}else if(data.coins>=i*80){data.coins-=i*80;data.owned.push(i);data.hero=i;save();show('shop');toast('新伙伴加入啦！')}else toast('金币还不够，继续闯关收集吧！')},'btn '+(owned?'green':'orange')));g.append(item)});p.append(g);p.append(node('p','🏅 徽章：'+(completed()>=10?'🌱 森林探险家 ':'')+(completed()>=30?'🧠 推理高手 ':'')+(completed()===60?'👑 逻辑大师':'')+(completed()<10?'再通过 '+(10-completed())+' 关就能拿到第一枚徽章！':''),'muted'))}
function parent(){let p=panel();p.append(node('h2','📊 家长观察报告'));p.append(node('p','完成 '+completed()+'/60 关，累计获得 '+stars()+' 颗星。以下数据反映各类关卡的完成情况，不是智力测评。','muted'));const rep=node('div',undefined,'report');skillNames.forEach(skill=>{let total=levels.filter(x=>x.skill===skill).length,done=levels.filter((x,i)=>x.skill===skill&&data.done[i]).length;let line=node('div',undefined,'reportline');line.append(node('span',skill));let track=node('div',undefined,'track');let fill=node('div',undefined,'fill');fill.style.width=done/total*100+'%';track.append(fill);line.append(track,node('b',done+'/'+total));rep.append(line)});p.append(rep);p.append(node('p','建议：每次玩10～15分钟，先让孩子独立尝试，再使用提示。','muted'));let snd=button(data.sound?'🔊 音效：开':'🔇 音效：关',()=>{data.sound=!data.sound;save();show('parent')},'btn gray');p.append(snd);const danger=node('div',undefined,'actions');danger.append(button('🗑️ 清空全部进度',()=>{const m=$('modal');m.replaceChildren();m.append(node('h2','确定清空吗？'),node('p','所有星星、金币、角色和关卡记录都会清除，无法恢复。'),button('取消',closeModal,'btn gray'),button('确认清空',()=>{data={done:{},coins:0,owned:[0],hero:0,sound:true};save();closeModal();show('home')},'btn orange'));$('overlay').classList.remove('hidden')},'btn gray'));p.append(danger)}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});show('home');
</script></body></html>
